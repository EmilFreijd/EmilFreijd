name: Publish a project
description: Submit a project write-up from GitHub mobile.
title: "[Project] "
labels: ["content:project"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Submit only final, approved English and Swedish copy prepared in private Daedalus. After submitting both versions, add the `publish-content` label to generate a pull request for technical review.
  - type: input
    id: slug
    attributes:
      label: Slug
      description: Unique URL name using lowercase letters, numbers, and hyphens. The -sv suffix is reserved. Keep the slug stable when editing.
      placeholder: applied-ai-prototype
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Publication date
      description: Use YYYY-MM-DD.
      placeholder: "2026-07-10"
    validations:
      required: true
  - type: dropdown
    id: sector
    attributes:
      label: Sector
      options: [public-sector, defence, enterprise, personal, other]
    validations:
      required: true
  - type: input
    id: en-title
    attributes:
      label: English title
    validations:
      required: true
  - type: textarea
    id: en-description
    attributes:
      label: English description
      description: One sentence, maximum 240 characters, used in cards and metadata.
    validations:
      required: true
  - type: textarea
    id: en-body
    attributes:
      label: English body
      description: Cover motivation, approach, build, result, and next steps. Markdown is supported; HTML, JSX, imports, exports, and braces are rejected.
      placeholder: "## Why I built it\n\nDescribe the motivation...\n\n## Result\n\nDescribe what works..."
    validations:
      required: true
  - type: input
    id: sv-title
    attributes:
      label: Swedish title
      description: Required before publishing. Complete all three Swedish fields.
    validations:
      required: true
  - type: textarea
    id: sv-description
    attributes:
      label: Swedish description
      description: Required before publishing. One sentence, maximum 240 characters.
    validations:
      required: true
  - type: textarea
    id: sv-body
    attributes:
      label: Swedish body
      description: Required before publishing. Complete all three Swedish fields.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional, comma-separated, maximum 12.
      placeholder: AI, Automation, Product Development
  - type: textarea
    id: metrics
    attributes:
      label: Metrics
      description: "Optional. One per line using: value | label"
      placeholder: "2 weeks | Prototype time\n1 | Working release"
  - type: textarea
    id: sv-metrics
    attributes:
      label: Swedish metrics
      description: "If Metrics is used, supply the same number of rows with Swedish values and labels: värde | etikett"
      placeholder: "3 team | Leveransomfattning"
  - type: checkboxes
    id: timeless
    attributes:
      label: Timeless
      options:
        - label: Timeless content
  - type: checkboxes
    id: featured
    attributes:
      label: Feature on homepage
      options:
        - label: Feature this content
  - type: checkboxes
    id: security
    attributes:
      label: Security review
      options:
        - label: Both language versions are final and cleared for public release.
          required: true
