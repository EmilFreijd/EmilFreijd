name: Publish content issue

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: content-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.label.name == 'publish-content' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Generate content files
        id: generate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/publish-content-issue.mjs

      - run: npm run check
      - run: npm run build

      - name: Commit generated content branch
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="content/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/content/stream
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish content from issue #${ISSUE_NUMBER}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open or update publishing pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          CONTENT_TITLE: ${{ steps.generate.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Publish: ${CONTENT_TITLE}" \
              --body "Generated from #${ISSUE_NUMBER}. Review the rendered content and merge when ready.\n\nCloses #${ISSUE_NUMBER}")
            gh pr edit "$PR_URL" --add-label content
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh issue comment "$ISSUE_NUMBER" --body "Publishing pull request ready: ${PR_URL}"

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Publishing validation failed. Review the workflow details, update the issue, then remove and re-add the publish-content label: ${RUN_URL}"
